[package]
name = "jj-compose"
version.workspace = true
edition.workspace = true
readme.workspace = true
authors.workspace = true
exclude.workspace = true
documentation.workspace = true
description.workspace = true
keywords = ["jujutsu", "jj", "tui", "conventional-commits", "split"]
categories = ["command-line-utilities", "development-tools"]
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
jj_compose_core = { path = "../core", version = "0.1.0" }
anyhow = { version = "1.0", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
ratatui = { version = "0.30", features = [
  "crossterm",
], default-features = false }
ratatui-textarea = "0.9"
ansi-to-tui = { version = "8.0", default-features = false }

[package.metadata.binstall]
pkg-url = "https://github.com/saylesss88/jj-compose/releases/download/v{ version }/jj-compose{ target }.tar.gz"
bin-dir = "jj-compose{ target }/jj-compose{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true
